# 구역 경계 새 자료 확인 (매주): 서울 열린데이터광장 OA-22712 파일 목록을 보고, 새 파일이 있으면 다시 만들어 올려요.
name: 구역 경계 확인
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 살펴보기
        run: |
          curl -sSL "https://data.seoul.go.kr/dataList/OA-22712/S/1/datasetView.do" -o page.html
          wc -c page.html
          grep -o '<script[^>]*src="[^"]*"' page.html | head -40
          grep -n -i -A25 'function downloadFile' page.html | head -80 || true
          for s in $(grep -o 'src="[^"]*\.js[^"]*"' page.html | sed 's/src="//;s/"$//'); do u="$s"; case "$u" in http*) ;; *) u="https://data.seoul.go.kr$u";; esac; curl -sSL "$u" -o f.js; if grep -q 'downloadFile' f.js; then echo "== $u"; grep -n -A30 'downloadFile *=\|function downloadFile' f.js | head -60; fi; done
