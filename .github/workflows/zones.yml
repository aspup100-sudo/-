# 구역 경계 새 자료 확인 (매주 월요일): 서울 열린데이터광장 OA-22712 파일 목록을 보고, 새 기준월 파일이 있으면 내려받아 data/zones 를 다시 만들어 올려요.
# 손으로 넣은 구역(data/zones/extra.json)은 건드리지 않아요.
name: 구역 경계 확인
on:
  schedule:
    - cron: "37 0 * * 1"   # 한국 시간 월요일 09:37
  workflow_dispatch:
    inputs:
      force:
        description: "새 파일이 없어도 다시 만들기 (점검용)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: daily-update
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 새 파일 확인
        id: f
        run: |
          python3 tools/fetch-zones.py "$RUNNER_TEMP/uq" ${{ inputs.force && '--force' || '' }} | tee f.log
          last=$(tail -1 f.log); rm f.log
          set -- $last
          echo "state=$1" >> "$GITHUB_OUTPUT"
          if [ "$1" = NEW ]; then echo "dir=$2" >> "$GITHUB_OUTPUT"; echo "date=$3" >> "$GITHUB_OUTPUT"; fi
      - name: 다시 만들기
        if: steps.f.outputs.state == 'NEW'
        run: |
          pip install -q pyshp pyproj openpyxl shapely
          base=https://raw.githubusercontent.com/southkorea/seoul-maps/master/juso/2015/json
          curl -sSfL $base/seoul_municipalities_geo.json -o "$RUNNER_TEMP/gu.json"
          curl -sSfL $base/seoul_neighborhoods_geo.json -o "$RUNNER_TEMP/dong.json"
          before=$(cat data/zones/1*.json | grep -o '"id":' | wc -l)
          python3 tools/build-zones.py "${{ steps.f.outputs.dir }}" "$RUNNER_TEMP/gu.json" "${{ steps.f.outputs.date }}" "$RUNNER_TEMP/dong.json"
          after=$(cat data/zones/1*.json | grep -o '"id":' | wc -l)
          echo "구역 수: $before → $after"
          [ "$after" -ge $((before * 8 / 10)) ] || { echo "구역 수가 너무 많이 줄었어요. 올리지 않아요."; git checkout -- data/zones; exit 1; }
          bad=$(git status --porcelain | awk '{print $2}' | grep -vE '^data/zones/' || true)
          [ -z "$bad" ] || { echo "예상 밖 파일: $bad"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zones
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "구역 경계 갱신 ${{ steps.f.outputs.date }} (서울플랜+ 자료, 구역 $before → $after)"
          git pull --rebase -q origin main
          git push
